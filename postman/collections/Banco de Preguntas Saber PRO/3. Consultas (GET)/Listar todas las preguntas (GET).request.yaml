$kind: http-request
description: Devuelve el arreglo con todas las preguntas archivadas en el banco.
url: "{{baseUrl}}/api/preguntas"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const preguntas = pm.response.json();

      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("El banco ya tiene preguntas", function () {
          pm.expect(preguntas.length).to.be.at.least(3);
      });
    language: text/javascript
order: 1000
