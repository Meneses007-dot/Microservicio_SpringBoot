$kind: http-request
description: "Consulta una sola pregunta. Respuesta esperada: 200 OK."
url: "{{baseUrl}}/api/preguntas/{{id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const pregunta = pm.response.json();

      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Devuelve la pregunta solicitada", function () {
          pm.expect(pregunta.id).to.eql(Number(pm.collectionVariables.get("id")));
      });
    language: text/javascript
order: 2000
