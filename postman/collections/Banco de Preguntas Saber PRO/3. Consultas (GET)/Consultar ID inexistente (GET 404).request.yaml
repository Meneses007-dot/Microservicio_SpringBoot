$kind: http-request
description: Evidencia de que un ID que no está en el banco responde 404 Not Found en lugar de 500.
url: "{{baseUrl}}/api/preguntas/99"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 404 Not Found", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 3000
