$kind: http-request
description: "Elimina la pregunta. Respuesta esperada: 204 No Content y cuerpo vacío."
url: "{{baseUrl}}/api/preguntas/{{id}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 204 No Content", function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 1000
